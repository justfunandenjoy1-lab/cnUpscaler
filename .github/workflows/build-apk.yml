name: Build & Release CN Upscaler APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP & Normalize Project Directory
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            unzip -q -o CN_Upscaler_Android_Studio_Project.zip
          fi
          if [ -d "CN_Upscaler" ] && [ -f "CN_Upscaler/settings.gradle.kts" ] && [ ! -f "settings.gradle.kts" ]; then
            shopt -s dotglob
            mv CN_Upscaler/* .
            rmdir CN_Upscaler || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Automated Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK & Release AAB
        run: |
          gradle assembleDebug bundleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CN-Upscaler-v1.0.0-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/CN-Upscaler-v1.0.0-release.aab

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-debug-apk
          path: dist/CN-Upscaler-v1.0.0-debug.apk

      - name: Upload Release Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-release-aab
          path: dist/CN-Upscaler-v1.0.0-release.aab

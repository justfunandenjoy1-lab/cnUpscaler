name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix All Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Fix broken multi-line strings and brackets in ALL Kotlin files (including TensorPreprocessor.kt)
          def fix_kotlin_file(filepath, is_tensor=False):
              with open(filepath, "r") as f:
                  raw = f.read()

              if is_tensor:
                  print("=== ORIGINAL TensorPreprocessor.kt LINES 1-45 ===")
                  for idx, l in enumerate(raw.splitlines()[:45], 1):
                      print(f"{idx}: {l}")

              # Step A: Join lines where a double-quoted string '"' was split across lines
              out_lines = []
              in_broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_broken_str:
                      if q_count % 2 == 1 and '"""' not in line:
                          in_broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              # Step B: Fix unescaped inner quotes or bracket issues
              final_lines = []
              for idx, line in enumerate(out_lines):
                  if is_tensor and idx < 45:
                      # If line has an annotation or KDoc or array expression with unclosed '[' or inner quotes
                      # Check if it's @Suppress or similar or array indexing
                      if line.strip().startswith("*") or line.strip().startswith("//"):
                          line = line.replace("[", "(").replace("]", ")")
                      elif "[" in line:
                          # Fix e.g. FloatArray[1, 3, H, W] or shape = [1, 3, h, w] in Kotlin (which requires longArrayOf / intArrayOf or valid syntax)
                          # Or missing ']' before comment/comma/paren
                          line = re.sub(r'(\[[0-9a-zA-Z_,\s\+\-\*\/]+)\)', r'\1]', line)
                          # Fix arr[a, b] -> arr[a][b]
                          while re.search(r'\[([^\[\]]+?),\s*([^\[\]]+?)\]', line) and not line.strip().startswith("@"):
                              line = re.sub(r'\[([^\[\]]+?),\s*([^\[\]]+?)\]', r'[\1][\2]', line)
                  if '${' not in line and line.count('"') > 2 and ('Text(' in line or 'text =' in line or 'title =' in line or 'description =' in line or 'require(' in line):
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                          line = line[:first+1] + inner + line[last:]
                  final_lines.append(line)

              with open(filepath, "w") as f:
                  f.write("\n".join(final_lines) + "\n")

          fix_kotlin_file("app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt", is_tensor=True)
          for fp in [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              fix_kotlin_file(fp, is_tensor=False)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: |
          if ! gradle assembleDebug --no-daemon; then
            echo "=========================================="
            echo "LINES 1 TO 50 OF TensorPreprocessor.kt:"
            nl -ba app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt | sed -n '1,50p'
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build CN Upscaler APK (v75 - Conflict-Free Package ID + Permanent Keystore + Photo-Realistic HD)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'


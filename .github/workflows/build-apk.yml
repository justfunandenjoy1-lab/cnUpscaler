name: Build CN Upscaler Android APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if Uploaded as Archive
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP archive: $ZIP_FILE — extracting..."
              unzip -o -q "$ZIP_FILE"
              if [ -d "CN_Upscaler" ] && [ -f "CN_Upscaler/settings.gradle.kts" ]; then
                cp -r CN_Upscaler/* .
                cp -r CN_Upscaler/.* . 2>/dev/null || true
              fi
            fi
          fi
          chmod +x gradlew || true

      - name: Apply Zero-Grain Gradio-5 Cloud AI + YCbCr Despeckle Patch
        run: |
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/ai/OnnxModelVerifier.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/ai/OnnxModelVerifier.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/ai/OnnxSuperResolutionEngine.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/ai/OnnxSuperResolutionEngine.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/image/ImageInspector.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/image/ImageInspector.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/image/SafeBitmapDecoder.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/image/SafeBitmapDecoder.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/processing/TileProcessor.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/processing/TileProcessor.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/feature/results/ResultsScreen.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/feature/results/ResultsScreen.kt"
          mkdir -p "$(dirname "app/src/main/java/com/cn/upscaler/feature/settings/UpscaleSettingsScreen.kt")"
          echo "" | base64 -d > "app/src/main/java/com/cn/upscaler/feature/settings/UpscaleSettingsScreen.kt"
          mkdir -p "$(dirname "app/src/test/java/com/cn/upscaler/core/processing/TileProcessorTest.kt")"
          echo "" | base64 -d > "app/src/test/java/com/cn/upscaler/core/processing/TileProcessorTest.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build & Upload Release AAB
        if: success()
        run: gradle bundleRelease --no-daemon || true

      - name: Upload Release Android App Bundle (AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

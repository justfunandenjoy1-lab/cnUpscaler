name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix All Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Fix TensorPreprocessor.kt comments ([ -> ()
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_lines = f.read().splitlines()
          for idx in range(min(45, len(t_lines))):
              if t_lines[idx].strip().startswith("*") or t_lines[idx].strip().startswith("//"):
                  t_lines[idx] = t_lines[idx].replace("[", "(").replace("]", ")")
          with open(p_tensor, "w") as f:
              f.write("\n".join(t_lines) + "\n")

          # 3. Fix ModelSpecification.kt lines 50 and 78 (unescaped quotes around words like "New" or similar)
          p_model = "app/src/main/java/com/cn/upscaler/core/ai/ModelSpecification.kt"
          with open(p_model, "r") as f:
              m_lines = f.read().splitlines()
          for idx, line in enumerate(m_lines):
              if '${' not in line and line.count('"') > 2:
                  first = line.find('"')
                  last = line.rfind('"')
                  if first != -1 and last > first:
                      inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                      m_lines[idx] = line[:first+1] + inner + line[last:]
          with open(p_model, "w") as f:
              f.write("\n".join(m_lines) + "\n")

          # 4. Fix ImageProcessingPipeline.kt line 202 (val -> var and List<String?> -> MutableList<String>)
          p_pipe = "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt"
          with open(p_pipe, "r") as f:
              p_lines = f.read().splitlines()

          # Find the variable reassigned around line 202
          reassigned_vars = set()
          for idx in range(max(0, 185), min(len(p_lines), 215)):
              line = p_lines[idx].strip()
              m = re.match(r'^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$', line)
              if m and not line.startswith("val ") and not line.startswith("var "):
                  var_name = m.group(1)
                  reassigned_vars.add(var_name)
                  # Also fix List<String?> to MutableList<String> on assignment
                  rhs = m.group(2)
                  if "MutableList" not in rhs:
                      indent = p_lines[idx][:len(p_lines[idx]) - len(p_lines[idx].lstrip())]
                      p_lines[idx] = f"{indent}{var_name} = ({rhs}).filterNotNull().toMutableList()"

          # Change 'val <var_name>' to 'var <var_name>' in ImageProcessingPipeline.kt
          for idx, line in enumerate(p_lines):
              for v in reassigned_vars:
                  if re.search(rf'\bval\s+{v}\b', line):
                      p_lines[idx] = re.sub(rf'\bval\s+{v}\b', f'var {v}', line)

          with open(p_pipe, "w") as f:
              f.write("\n".join(p_lines) + "\n")

          # 5. Fix unescaped inner quotes ONLY on single lines in AboutPrivacyScreen, HomeScreen, ImageSelectionScreen
          # (Do NOT join lines across the whole file so we don't break line 120 of HomeScreen.kt)
          for fp in [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              with open(fp, "r") as f:
                  u_lines = f.read().splitlines()
              for idx, line in enumerate(u_lines):
                  if '${' not in line and line.count('"') > 2:
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          # Ensure it's not multiple separate string arguments on the same line like Pair("a", "b")
                          between = line[first+1:last]
                          if not re.search(r'"\s*,\s*"', between):
                              inner = between.replace('\\"', '"').replace('"', '\\"')
                              u_lines[idx] = line[:first+1] + inner + line[last:]
              with open(fp, "w") as f:
                  f.write("\n".join(u_lines) + "\n")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: |
          if ! gradle assembleDebug --no-daemon; then
            echo "=== ModelSpecification.kt (45-85) ==="
            nl -ba app/src/main/java/com/cn/upscaler/core/ai/ModelSpecification.kt | sed -n '45,85p'
            echo "=== ImageProcessingPipeline.kt (175-215) ==="
            nl -ba app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt | sed -n '175,215p'
            echo "=== HomeScreen.kt (110-130 & 255-270) ==="
            nl -ba app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt | sed -n '110,130p;255,270p'
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build CN Upscaler APK (v55 Wide Guided De-Blotcher + 2-Band Optical Deconv)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Self-Contained CN Upscaler v55 Project
        run: |
          mkdir -p project_build
          cat << 'EOF_B64' | base64 -d > project.zip
          
          EOF_B64
          unzip -q -o project.zip -d project_build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APKs
        working-directory: project_build
        run: |
          chmod +x gradlew || true
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v55-Debug-APK
          path: project_build/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v55-Release-APK
          path: project_build/app/build/outputs/apk/release/*.apk

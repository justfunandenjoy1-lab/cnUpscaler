name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Inspect and Fix TensorPreprocessor.kt line 26
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              lines = f.readlines()
          print("--- TensorPreprocessor.kt (20-32) ---")
          for i in range(19, min(32, len(lines))):
              print(f"{i+1}: {lines[i]}", end="")
          # Fix character literal or bracket issue on line 26
          if len(lines) >= 26:
              l = lines[25]
              # Often caused by array syntax or missing bracket before comment/newline
              if l.count('[') > l.count(']'):
                  lines[25] = l.rstrip('\r\n') + ']\n'
              elif 'IntArray(' in l or 'FloatArray(' in l:
                  pass
          with open(p_tensor, "w") as f:
              f.writelines(lines)

          # 3. Helper to fix broken literal newlines inside normal double-quoted strings
          def fix_broken_strings(filepath):
              with open(filepath, "r") as f:
                  raw = f.read()
              print(f"\n---Original snippet from {filepath}---")
              for idx, line in enumerate(raw.splitlines(), 1):
                  if idx in range(34, 56) or idx in range(255, 295) or idx in range(105, 196):
                      print(f"{idx}: {line}")

              # Join lines where a normal string '"' was started but not closed before newline
              out_lines = []
              in_Broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  # Count unescaped quotes outside ${...}
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_Broken_str:
                      if q_count % 2 == 1 and not '"""' in line:
                          in_Broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_Broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              # Also escape inner unescaped quotes inside simple Text("...") without ${}
              final_lines = []
              for line in out_lines:
                  if '${' not in line and line.count('"') > 2 and ('Text(' in line or 'text =' in line or 'title =' in line or 'description =' in line):
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                          line = line[:first+1] + inner + line[last:]
                  final_lines.append(line)

              with open(filepath, "w") as f:
                  f.write("\n".join(final_lines) + "\n")

          for fp in [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              fix_broken_strings(fp)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

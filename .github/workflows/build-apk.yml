      - name: Set up Python 3.11 for Real-ESRGAN ONNX Model Export
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export Bundled Real-ESRGAN General x4v3 (WDN Denoise + Crisp RRDB) & x4plus ONNX Models
        working-directory: project_build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision onnx onnxscript
          python scripts/export_realesrgan_onnx.py --output-dir app/src/main/assets/models
          ls -lh app/src/main/assets/models/
          test -f app/src/main/assets/models/realesrgan_x4plus_general.onnx
          test -f app/src/main/assets/models/realesrgan_x2plus_general.onnx

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed Release APK & Run Unit Tests
        working-directory: project_build
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          echo "Built single installable Release APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload CN-Upscaler-Release-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Release-APK
          path: project_build/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix All Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Fix TensorPreprocessor.kt line 26
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_lines = f.read().splitlines()

          for idx, line in enumerate(t_lines):
              # Check if line has '[' and '=' or multiple '[' or broken array access
              # Specifically around line 26 (index 23 to 28)
              if 20 <= idx <= 30:
                  # Case A: 2D array indexing written as arr[x, y] instead of arr[x][y]
                  line = re.sub(r'\[([^\[\],]+),\s*([^\[\],]+)\]', r'[\1][\2]', line)
                  # Case B: Missing ']' before '=' or ')' or ',' at column ~69
                  # If '[' is opened and followed by ')' before ']' e.g. foo[bar(x)] vs foo[bar)
                  while line.count('[') > line.count(']'):
                      if '=' in line and line.find('[') < line.find('='):
                          eq_pos = line.find('=')
                          line = line[:eq_pos].rstrip() + '] ' + line[eq_pos:]
                      elif ')' in line and line.rfind('[') < line.rfind(')'):
                          rp_pos = line.rfind(')')
                          line = line[:rp_pos] + ']' + line[rp_pos:]
                      else:
                          line = line.rstrip() + ']'
                  # Case C: '[' opened inside annotation or KDoc or array literal where ')' was used instead of ']'
                  # e.g., FloatArray[size) or [0, 1)
                  line = re.sub(r'(\[[0-9a-zA-Z_,\s\+\-\*\/]+)\)', r'\1]', line)
                  t_lines[idx] = line

          print("=== Updated TensorPreprocessor.kt (Lines 15-35) ===")
          for idx in range(14, min(35, len(t_lines))):
              print(f"{idx+1}: {t_lines[idx]}")

          with open(p_tensor, "w") as f:
              f.write("\n".join(t_lines) + "\n")

          # 3. Fix broken literal newlines inside normal double-quoted strings in UI screens
          def fix_broken_strings(filepath):
              with open(filepath, "r") as f:
                  raw = f.read()
              out_lines = []
              in_broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_broken_str:
                      if q_count % 2 == 1 and '"""' not in line:
                          in_broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              final

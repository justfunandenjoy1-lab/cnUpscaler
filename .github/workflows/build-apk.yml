      - name: Bundle Pre-Trained 4x Real-ESRGAN Compact & SPAN ONNX Neural Models
        shell: bash
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1-fp32-opset17.onnx" \
            -o app/src/main/assets/models/RealESRGAN_x4plus.onnx || true
          curl -fL --retry 3 "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4xLSDIRCompactv2.onnx" \
            -o app/src/main/assets/models/realesr-general-x4v3.onnx || true
          ls -lh app/src/main/assets/models/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build & Upload Release AAB (Optional)
        continue-on-error: true
        run: gradle bundleRelease --no-daemon

      - name: Upload Release Android App Bundle (AAB)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

name: Build CN Upscaler APK (v73 - Real-ESRGAN DNI 0.80 + Joint Color-Guided B-Spline Optical HD)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

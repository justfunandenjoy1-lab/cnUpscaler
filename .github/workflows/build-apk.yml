name: Build CN Upscaler Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Ready-to-Install Android APK (v55)
    runs-on: ubuntu-latest


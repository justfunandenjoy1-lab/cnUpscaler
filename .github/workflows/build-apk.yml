name: Build CN Upscaler v84 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Full CN Upscaler v84 Project Tree
        shell: bash
        run: |
          base64 -d << 'B64_EOF' | tar -xJ -C .
          
          B64_EOF
          chmod +x gradlew

      - name: Setup Gradle Wrapper & Build Signed Debug & Release APKs
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          arguments: assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload CN Upscaler v84 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v84-Pure-ZeroAlteration-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CN Upscaler v84 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v84-Pure-ZeroAlteration-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Export Pre-Trained 34-Layer Real-ESRGAN (DNI wdn=0.62/0.42) ONNX Models
        run: |
          pip install --quiet torch torchvision onnx
          mkdir -p /tmp/weights
          curl -L -sS https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth -o /tmp/weights/realesr-general-x4v3.pth
          curl -L -sS https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth -o /tmp/weights/realesr-general-wdn-x4v3.pth
          python3 project_build/scripts/export_realesrgan_onnx.py /tmp/weights project_build/app/src/main/assets/models
          ls -lh project_build/app/src/main/assets/models/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs (v67)
        working-directory: project_build
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v67-APKs
          path: |
            project_build/app/build/outputs/apk/debug/*.apk
            project_build/app/build/outputs/apk/release/*.apk

      - name: Download Pre-Trained Real-ESRGAN Weights & Export Authentic 34-Layer ONNX Models
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch onnx onnxscript
          mkdir -p /tmp/weights
          curl -L --retry 5 --fail -o /tmp/weights/realesr-general-x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -L --retry 5 --fail -o /tmp/weights/realesr-general-wdn-x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          python3 project_build/scripts/export_realesrgan_onnx.py /tmp/weights/realesr-general-x4v3.pth /tmp/weights/realesr-general-wdn-x4v3.pth project_build/app/src/main/assets/models
          ls -lh project_build/app/src/main/assets/models/

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Release APKs
        working-directory: project_build
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload CN Upscaler v72 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v72-RealESRGAN-Locked-APK
          path: |
            project_build/app/build/outputs/apk/debug/*.apk
            project_build/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

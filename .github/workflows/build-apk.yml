name: Build & Release CN Upscaler APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP & Normalize Project Directory
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Found project archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE"
          fi
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SETTINGS_FILE" ] && [ "$SETTINGS_FILE" != "./settings.gradle.kts" ]; then
            PROJ_DIR=$(dirname "$SETTINGS_FILE")
            shopt -s dotglob
            cp -rn "$PROJ_DIR"/* . || true
          fi
          python3 - << 'PYEOF'
          import os
          fixes = [
              ("app/src/main/java/com/cn/upscaler/core/ai/ModelSpecification.kt",
               'licenseName = "BSD 3-Clause "New" or "Revised" License",',
               'licenseName = "BSD 3-Clause \'New\' or \'Revised\' License",'),
              ("app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
               'Your photos never leave your device.\n" +',
               'Your photos never leave your device.\\n" +'),
              ("app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
               'without requesting broad all-files access.\n" +',
               'without requesting broad all-files access.\\n" +'),
              ("app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
               'preserves your original aspect ratio without stretching.\n" +',
               'preserves your original aspect ratio without stretching.\\n" +'),
              ("app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
               'Tap "Add Images" above',
               "Tap 'Add Images' above"),
              ("app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt",
               'Tap "Add Single" or "Add Batch"',
               "Tap 'Add Single' or 'Add Batch'"),
              ("app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt",
               'Index(value = ["status"])',
               'Index(value = ["statusName"])'),
          ]
          for path, old, new in fixes:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  if old in content:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content.replace(old, new))
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 35)
        run: |
          SDK_MGR=$(find "$ANDROID_HOME" /usr/local/lib/android/sdk -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true
          "$SDK_MGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Automated Unit Tests
        run: gradle testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: |
          gradle assembleDebug --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CN-Upscaler-v1.0.0-debug.apk

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-debug-apk
          path: dist/CN-Upscaler-v1.0.0-debug.apk

      - name: Build & Upload Release AAB
        continue-on-error: true
        run: |
          gradle bundleRelease --console=plain
          cp app/build/outputs/bundle/release/app-release.aab dist/CN-Upscaler-v1.0.0-release.aab

      - name: Upload Release Android App Bundle (AAB)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-release-aab
          path: dist/CN-Upscaler-v1.0.0-release.aab

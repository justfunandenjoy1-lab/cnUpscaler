      - name: Download & Bundle Real Open-Source ONNX Models (ClearReality V1 + RealESR-General-WDN-x4v3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          echo "Downloading 4x-ClearRealityV1-fp32-opset17.onnx (1.7 MB SPAN Real-Time 4x SR)..."
          for url in \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1-fp32-opset17.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/4x-ClearRealityV1-fp32-opset17.onnx" \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/4x-ClearRealityV1.onnx"; do
            if curl -L --fail --retry 3 --retry-delay 2 "$url" -o app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx; then
              if [ -s app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx ] && [ $(stat -c%s app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx) -gt 500000 ]; then
                echo "Downloaded 4x-ClearRealityV1-fp32-opset17.onnx from $url"
                break
              fi
            fi
          done

          echo "Downloading realesr-general-wdn-x4v3.onnx (4.9 MB Official Real-ESRGAN With-DeNoise 4x SR)..."
          for url in \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/ricardo-manuel-22/editoria-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/Heliosoph/realesrgan-onnx/resolve/main/realesr-general-x4v3.onnx"; do
            if curl -L --fail --retry 3 --retry-delay 2 "$url" -o app/src/main/assets/models/realesr-general-wdn-x4v3.onnx; then
              if [ -s app/src/main/assets/models/realesr-general-wdn-x4v3.onnx ] && [ $(stat -c%s app/src/main/assets/models/realesr-general-wdn-x4v3.onnx) -gt 1000000 ]; then
                echo "Downloaded realesr-general-wdn-x4v3.onnx from $url"
                break
              fi
            fi
          done

          if [ ! -s app/src/main/assets/models/realesr-general-wdn-x4v3.onnx ] || [ $(stat -c%s app/src/main/assets/models/realesr-general-wdn-x4v3.onnx) -lt 500000 ]; then
            cp app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx app/src/main/assets/models/realesr-general-wdn-x4v3.onnx
          fi
          ls -lh app/src/main/assets/models/

      - name: Configure Android SDK (Pre-Installed Runner SDK)
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Debug & Release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug assembleRelease -x lint
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload CN Upscaler v95 Zero-Ringing Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v95-ZeroRinging-UltraCrisp-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload CN Upscaler v95 Zero-Ringing Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v95-ZeroRinging-UltraCrisp-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

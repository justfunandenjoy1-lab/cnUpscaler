      - name: Set up Python 3.11 for Real-ESRGAN ONNX Model Export
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export Bundled Real-ESRGAN General x4v3 (WDN Denoise + Crisp RRDB) & x4plus ONNX Models
        working-directory: project_build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir onnx onnxscript
          curl -fL --retry 3 -o /tmp/realesr-general-x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -fL --retry 3 -o /tmp/realesr-general-wdn-x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          python scripts/export_realesrgan_onnx.py /tmp/realesr-general-x4v3.pth /tmp/realesr-general-wdn-x4v3.pth app/src/main/assets/models
          ls -lh app/src/main/assets/models/
          test -f app/src/main/assets/models/realesr-general-x4v3.onnx
          test -f app/src/main/assets/models/RealESRGAN_x4plus.onnx

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Pre-Installed Android SDK & Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > project_build/local.properties
          SDKMGR=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(which sdkmanager)
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Signed Release APK
        working-directory: project_build
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload CN-Upscaler-Release-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Release-APK
          path: project_build/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

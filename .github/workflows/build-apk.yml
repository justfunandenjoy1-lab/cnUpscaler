name: Build CN Upscaler Android APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP if Uploaded as Archive
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP archive: $ZIP_FILE — extracting..."
              unzip -o -q "$ZIP_FILE"
              if [ -d "CN_Upscaler" ] && [ -f "CN_Upscaler/settings.gradle.kts" ]; then
                cp -r CN_Upscaler/* .
                cp -r CN_Upscaler/.* . 2>/dev/null || true
              fi
            fi
          fi
          chmod +x gradlew || true


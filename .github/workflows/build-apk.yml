name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Fix AboutPrivacyScreen Quotes & Syntax
        run: |
          python3 - << 'EOF'
          import re

          # 1. JobEntity.kt fix
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. TensorPreprocessor.kt comments fix
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_lines = f.read().splitlines()
          for idx in range(min(45, len(t_lines))):
              if t_lines[idx].strip().startswith("*") or t_lines[idx].strip().startswith("//"):
                  t_lines[idx] = t_lines[idx].replace("[", "(").replace("]", ")")
          with open(p_tensor, "w") as f:
              f.write("\n".join(t_lines) + "\n")

          # 3. ImageProcessingPipeline.kt fix
          p_pipe = "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt"
          with open(p_pipe, "r") as f:
              c_pipe = f.read()
          c_pipe = re.sub(
              r'accumulatedWarnings\s*\+=\s*([a-zA-Z0-9_\.\!\?]+)',
              r'accumulatedWarnings.add(\1)',
              c_pipe
          )
          with open(p_pipe, "w") as f:
              f.write(c_pipe)

          # 4. Clean fix for AboutPrivacyScreen.kt lines 35-55 (replace raw broken multi-line strings with escaped single-line or valid string)
          p_about = "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt"
          with open(p_about, "r") as f:
              about_content = f.read()
          
          # Fix common unescaped quotes or broken strings specifically in AboutPrivacyScreen
          # Replace any inner unclosed quotes inside Text components cleanly
          lines = about_content.splitlines()
          for idx, line in enumerate(lines):
              if 35 <= idx + 1 <= 55:
                  # If the line contains unescaped quotes inside parameters, escape them properly
                  if 'Text(' in line or 'text =' in line:
                      # Keep the outer quotes, escape inner ones
                      parts = line.split('"')
                      if len(parts) >= 5:
                          # e.g., Text("Something "quoted" here") -> Text("Something \"quoted\" here")
                          outer_start = parts[0] + '"'
                          inner = '\\"'.join(parts[1:-1])
                          outer_end = '"' + parts[-1]
                          lines[idx] = outer_start + inner + outer_end
          with open(p_about, "w") as f:
              f.write("\n".join(lines) + "\n")

          # 5. General safe quote fixer for other safe files
          def safe_fix_quotes(filepath):
              with open(filepath, "r") as f:
                  lines = f.read().splitlines()
              for idx, line in enumerate(lines):
                  if '${' in line or ' else ' in line or 'if (' in line:
                      continue
                  if line.count('"') > 2:
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          between = line[first+1:last]
                          if not re.search(r'"\s*,\s*"', between):
                              inner = between.replace('\\"', '"').replace('"', '\\"')
                              lines[idx] = line[:first+1] + inner + line[last:]
              with open(filepath, "w") as f:
                  f.write("\n".join(lines) + "\n")

          for fp in [
              "app/src/main/java/com/cn/upscaler/core/ai/ModelSpecification.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              safe_fix_quotes(fp)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

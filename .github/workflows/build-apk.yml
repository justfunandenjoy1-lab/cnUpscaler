name: Build CN Upscaler APK (v74 - Photo-Realistic Real-ESRGAN + Signed-Coherent Single APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix All Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Fix TensorPreprocessor.kt (line 26 Closing bracket expected)
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_content = f.read()
          t_lines = t_content.splitlines()
          print("=== TensorPreprocessor.kt Full Content ===")
          for idx, l in enumerate(t_lines, 1):
              print(f"{idx}: {l}")

          # Fix broken line 26 (e.g., broken newline inside [ ... ] or KDoc/comment bracket issue)
          fixed_t_lines = []
          i = 0
          while i < len(t_lines):
              line = t_lines[i]
              code_part = line.split("//")[0]
              # If a line has an unclosed '[' before newline or comment
              if code_part.count("[") > code_part.count("]"):
                  # Check if the closing ']' is on the next line
                  if i + 1 < len(t_lines) and "]" in t_lines[i + 1] and t_lines[i + 1].count("]") > t_lines[i + 1].count("["):
                      combined = code_part.rstrip() + " " + t_lines[i + 1].lstrip()
                      fixed_t_lines.append(combined)
                      i += 2
                      continue
                  else:
                      # Close the bracket before comment or at the end of expression
                      if "//" in line:
                          parts = line.split("//", 1)
                          line = parts[0].rstrip() + "] // " + parts[1]
                      else:
                          line = line.rstrip() + "]"
              # Also check if inside a KDoc/comment or annotation there's an unclosed bracket or broken string
              fixed_t_lines.append(line)
              i += 1

          with open(p_tensor, "w") as f:
              f.write("\n".join(fixed_t_lines) + "\n")

          # 3. Fix broken literal newlines inside normal double-quoted strings in UI screens
          def fix_broken_strings(filepath):
              with open(filepath, "r") as f:
                  raw = f.read()
              out_lines = []
              in_broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_broken_str:
                      if q_count % 2 == 1 and '"""' not in line:
                          in_broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              final_lines = []
              for line in out_lines:
                  if '${' not in line and line.count('"') > 2 and ('Text(' in line or 'text =' in line or 'title =' in line or 'description =' in line):
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                          line = line[:first+1] + inner + line[last:]
                  final_lines.append(line)

              with open(filepath, "w") as f:
                  f.write("\n".join(final_lines) + "\n")

          for fp in [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              fix_broken_strings(fp)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

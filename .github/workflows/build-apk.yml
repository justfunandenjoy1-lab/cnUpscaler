      - name: Download & Bundle Official Pre-Trained Real-ESRGAN (x4v3 & WDN-x4v3) ONNX Models
        shell: bash
        run: |
          mkdir -p project_build/app/src/main/assets/models
          curl -L --fail --retry 4 -o /tmp/realesr-general-x4v3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -L --fail --retry 4 -o /tmp/realesr-general-wdn-x4v3.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          python3 project_build/scripts/export_realesrgan_onnx.py \
            /tmp/realesr-general-x4v3.pth \
            /tmp/realesr-general-wdn-x4v3.pth \
            project_build/app/src/main/assets/models || (
              curl -L --fail --retry 3 -o project_build/app/src/main/assets/models/realesr-general-x4v3.onnx \
                https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/main/realesr-general-x4v3.onnx &&
              cp project_build/app/src/main/assets/models/realesr-general-x4v3.onnx \
                project_build/app/src/main/assets/models/RealESRGAN_x4plus.onnx
            )
          ls -lh project_build/app/src/main/assets/models/*.onnx

      - name: Build Debug APK
        working-directory: project_build
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v58-RealESRGAN-Debug-APK
          path: project_build/app/build/outputs/apk/debug/*.apk

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Fix AboutPrivacyScreen Exactly
        run: |
          python3 - << 'EOF'
          import re

          # 1. JobEntity.kt fix
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. TensorPreprocessor.kt comments fix
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_lines = f.read().splitlines()
          for idx in range(min(45, len(t_lines))):
              if t_lines[idx].strip().startswith("*") or t_lines[idx].strip().startswith("//"):
                  t_lines[idx] = t_lines[idx].replace("[", "(").replace("]", ")")
          with open(p_tensor, "w") as f:
              f.write("\n".join(t_lines) + "\n")

          # 3. ImageProcessingPipeline.kt fix
          p_pipe = "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt"
          with open(p_pipe, "r") as f:
              c_pipe = f.read()
          c_pipe = re.sub(
              r'accumulatedWarnings\s*\+=\s*([a-zA-Z0-9_\.\!\?]+)',
              r'accumulatedWarnings.add(\1)',
              c_pipe
          )
          with open(p_pipe, "w") as f:
              f.write(c_pipe)

          # 4. Safe rewrite of AboutPrivacyScreen.kt to completely avoid broken quote issues
          p_about = "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt"
          with open(p_about, "r") as f:
              about_code = f.read()
          
          # Clean up any broken multi-line strings inside AboutPrivacyScreen by converting unescaped quotes
          lines = about_code.splitlines()
          new_lines = []
          for line in lines:
              # If line contains raw unescaped quotes inside Text/content parameters, clean them
              if 'text =' in line or 'Text(' in line or 'contentDescription' in line:
                  # Replace problematic unescaped inner quotes safely
                  line = line.replace('“', '"').replace('”', '"')
              new_lines.append(line)
          
          with open(p_about, "w") as f:
              f.write("\n".join(new_lines) + "\n")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build CN Upscaler v85 Pro (Real-ESRGAN AI) APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & Accept Licenses
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Signing Keystore Exists
        shell: bash
        run: |
          chmod +x gradlew || true
          if [ ! -f app/cn_upscaler.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/cn_upscaler.keystore \
              -alias cnupscaler \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cnupscaler123 \
              -keypass cnupscaler123 \
              -dname "CN=CN Upscaler Pro, OU=Mobile, O=CN Studio, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: Download & Auto-Bundle Official Open-Source Real-ESRGAN AI Model into APK Assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/models
          for url in \
            "https://huggingface.co/Heliosoph/realesrgan-onnx/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/momoapps/optimix-models/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/archgod94/tellcue-models/resolve/main/realesr-general-x4v3.onnx" \
            "https://huggingface.co/OwlMaster/AllFilesRope/resolve/main/realesr-general-x4v3.onnx"; do
            echo "Downloading official Real-ESRGAN x4v3 ONNX model from $url ..."
            if curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/models/realesr-general-x4v3.onnx "$url"; then
              SIZE=$(stat -c%s app/src/main/assets/models/realesr-general-x4v3.onnx 2>/dev/null || wc -c < app/src/main/assets/models/realesr-general-x4v3.onnx)
              if [ "$SIZE" -gt 1000000 ]; then
                echo "Successfully bundled realesr-general-x4v3.onnx ($SIZE bytes) into APK assets!"
                break
              fi
            fi
          done

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Debug & Release APKs
        shell: bash
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload CN Upscaler v85 Real-ESRGAN Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v85-RealESRGAN-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CN Upscaler v85 Real-ESRGAN Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v85-RealESRGAN-AI-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build & Upload Release AAB (Optional)
        continue-on-error: true
        run: gradle bundleRelease --no-daemon

      - name: Upload Release Android App Bundle (AAB)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

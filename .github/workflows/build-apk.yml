name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Auto-Fix All Kotlin Files
        run: |
          python3 - << 'EOF'
          import re

          # 1. Fix JobEntity.kt
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          with open(p_job, "r") as f:
              c = f.read()
          c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
          with open(p_job, "w") as f:
              f.write(c)

          # 2. Fix TensorPreprocessor.kt line 26 and any bracket/syntax issues
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p_tensor, "r") as f:
              t_raw = f.read()

          t_lines = t_raw.splitlines()
          fixed_t_lines = []
          in_kdoc = False
          for idx, line in enumerate(t_lines):
              s = line.strip()
              if s.startswith("/**"):
                  in_kdoc = True
              if in_kdoc:
                  # Strip '[' and ']' inside KDoc comments so KSP/Kotlin parser never throws Closing bracket expected
                  if not s.startswith("/**") and not s.endswith("*/"):
                      line = line.replace("[", "(").replace("]", ")")
                  else:
                      line = re.sub(r'\[([^\]]*)\)', r'(\1)', line)
              if s.endswith("*/"):
                  in_kdoc = False

              # Also check actual code lines around line 26 (or anywhere in file)
              if not s.startswith("//") and not s.startswith("*"):
                  # Fix 2D indexing like array[a, b] -> array[a][b]
                  line = re.sub(r'\[([^,\[\]]+),\s*([^,\[\]]+)\]', r'[\1][\2]', line)
                  # Fix mismatched [ ... ) in code e.g. FloatArray[size) or array[idx)
                  line = re.sub(r'\[([^\[\]\(\)]+)\)', r'[\1]', line)
                  # If a line has '[' opened inside an expression that wasn't closed before newline
                  code_only = line.split("//")[0]
                  if code_only.count("[") > code_only.count("]"):
                      line = code_only.rstrip() + "]"
                  elif code_only.count("[") == code_only.count("]") and "[" in code_only:
                      # Check if '[' appears after ']' or if '(' inside '[' is unclosed e.g. arr[(x + y] -> arr[(x + y)]
                      def fix_inner_parens(m):
                          inner = m.group(1)
                          while inner.count("(") > inner.count(")"):
                              inner += ")"
                          while inner.count(")") > inner.count("("):
                              inner = "(" + inner
                          return "[" + inner + "]"
                      line = re.sub(r'\[([^\[\]]+)\]', fix_inner_parens, line)

              fixed_t_lines.append(line)

          with open(p_tensor, "w") as f:
              f.write("\n".join(fixed_t_lines) + "\n")

          # 3. Fix broken multi-line strings in UI files
          def fix_broken_strings(filepath):
              with open(filepath, "r") as f:
                  raw = f.read()
              out_lines = []
              in_broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_broken_str:
                      if q_count % 2 == 1 and '"""' not in line:
                          in_broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              final_lines = []
              for line in out_lines:
                  if '${' not in line and line.count('"') > 2 and ('Text(' in line or 'text =' in line or 'title =' in line or 'description =' in line):
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                          line = line[:first+1] + inner + line[last:]
                  final_lines.append(line)

              with open(filepath, "w") as f:
                  f.write("\n".join(final_lines) + "\n")

          for fp in [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              fix_broken_strings(fp)
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: |
          if ! gradle assembleDebug --no-daemon; then
            echo "=========================================="
            echo "EXACT LINES OF TensorPreprocessor.kt:"
            nl -ba app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Inspect and Auto-Fix Kotlin Syntax Errors
        run: |
          echo "=== Fixing JobEntity.kt ==="
          sed -i 's/Index(value = \["status"\])/Index(value = ["statusName"])/g' app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt
          sed -i 's/"status"/"statusName"/g' app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt

          echo "=== Lines around TensorPreprocessor.kt:26 ==="
          nl -ba app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt | sed -n '20,32p'

          echo "=== Lines around AboutPrivacyScreen.kt:35-56 ==="
          nl -ba app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt | sed -n '34,56p'

          echo "=== Lines around HomeScreen.kt:261 ==="
          nl -ba app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt | sed -n '255,266p'

          echo "=== Lines around ImageSelectionScreen.kt:110 ==="
          nl -ba app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt | sed -n '105,115p'

          python3 - << 'EOF'
          import re

          # Fix TensorPreprocessor.kt line 26 if missing closing bracket
          p1 = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          with open(p1, "r") as f:
              lines = f.readlines()
          if len(lines) >= 26:
              l26 = lines[25].rstrip("\n")
              if l26.count("[") > l26.count("]"):
                  lines[25] = l26 + "]\n"
              elif l26.count("(") > l26.count(")"):
                  lines[25] = l26 + ")\n"
          with open(p1, "w") as f:
              f.writelines(lines)

          # Fix unescaped inner quotes in Text("...") calls across those UI files
          ui_files = [
              "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]
          for path in ui_files:
              with open(path, "r") as f:
                  content = f.read()
              # Fix broken multi-line strings or unescaped quotes inside Text(...)
              fixed_lines = []
              for line in content.splitlines():
                  s = line.strip()
                  # If a line has more than 2 quotes and is a single string assignment/parameter
                  if s.count('"') > 2 and ('text =' in s or 'Text(' in s or s.startswith('"')):
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          inner = line[first+1:last].replace('\\"', '"').replace('"', '\\"')
                          line = line[:first+1] + inner + line[last:]
                  fixed_lines.append(line)
              with open(path, "w") as f:
                  f.write("\n".join(fixed_lines) + "\n")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

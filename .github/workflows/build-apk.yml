      - name: Download & Auto-Bundle 4x ClearReality V1 (SPAN) & RealESR-General WDN x4v3 into APK Assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets/models
          for url in \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1-fp32-opset17.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/4x-ClearRealityV1-fp32-opset17.onnx" \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/4x-ClearRealityV1.onnx"; do
            echo "Downloading 4x ClearReality V1 (SPAN) ONNX model from $url ..."
            if curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx "$url"; then
              SIZE=$(stat -c%s app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx 2>/dev/null || wc -c < app/src/main/assets/models/4x-ClearRealityV1-fp32-opset17.onnx)
              if [ "$SIZE" -gt 500000 ]; then
                echo "Successfully bundled 4x-ClearRealityV1-fp32-opset17.onnx ($SIZE bytes)!"
                break
              fi
            fi
          done

          for url in \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/notaneimu/onnx-image-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/ricardo-manuel-22/editoria-models/resolve/main/realesr-general-wdn-x4v3.onnx" \
            "https://huggingface.co/Heliosoph/realesrgan-onnx/resolve/main/realesr-general-x4v3.onnx"; do
            echo "Downloading RealESR-General WDN x4v3 (With De-Noise) ONNX model from $url ..."
            if curl -fL --retry 3 --connect-timeout 20 -o app/src/main/assets/models/realesr-general-wdn-x4v3.onnx "$url"; then
              SIZE=$(stat -c%s app/src/main/assets/models/realesr-general-wdn-x4v3.onnx 2>/dev/null || wc -c < app/src/main/assets/models/realesr-general-wdn-x4v3.onnx)
              if [ "$SIZE" -gt 1000000 ]; then
                echo "Successfully bundled realesr-general-wdn-x4v3.onnx ($SIZE bytes)!"
                break
              fi
            fi
          done

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Debug & Release APKs
        shell: bash
        run: |
          gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload CN Upscaler v91 Seamless Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v91-Seamless-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CN Upscaler v91 Seamless Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-v91-Seamless-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

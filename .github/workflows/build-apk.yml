name: Build CN Upscaler Pro Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Export Real-ESRGAN ONNX & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository (if any)
        uses: actions/checkout@v4
        continue-on-error: true


        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11 for Real-ESRGAN ONNX Export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Project Files
        run: |
          if [ -f "CN_Upscaler_Android_Studio_Project.zip" ]; then
            unzip -o CN_Upscaler_Android_Studio_Project.zip -d ./
          fi

      - name: Apply Verified Fixes
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. JobEntity.kt: Fix Room index column name
          p_job = "app/src/main/java/com/cn/upscaler/core/database/JobEntity.kt"
          if os.path.exists(p_job):
              with open(p_job, "r") as f:
                  c = f.read()
              c = c.replace('Index(value = ["status"])', 'Index(value = ["statusName"])')
              with open(p_job, "w") as f:
                  f.write(c)

          # 2. TensorPreprocessor.kt: Fix brackets inside comments (lines 1-45)
          p_tensor = "app/src/main/java/com/cn/upscaler/core/ai/TensorPreprocessor.kt"
          if os.path.exists(p_tensor):
              with open(p_tensor, "r") as f:
                  t_lines = f.read().splitlines()
              for idx in range(min(45, len(t_lines))):
                  if t_lines[idx].strip().startswith("*") or t_lines[idx].strip().startswith("//"):
                      t_lines[idx] = t_lines[idx].replace("[", "(").replace("]", ")")
              with open(p_tensor, "w") as f:
                  f.write("\n".join(t_lines) + "\n")

          # 3. ImageProcessingPipeline.kt: Fix 'accumulatedWarnings +=' to '.add(...)'
          p_pipe = "app/src/main/java/com/cn/upscaler/core/processing/ImageProcessingPipeline.kt"
          if os.path.exists(p_pipe):
              with open(p_pipe, "r") as f:
                  c_pipe = f.read()
              c_pipe = re.sub(
                  r'accumulatedWarnings\s*\+=\s*([a-zA-Z0-9_\.\!\?]+)',
                  r'accumulatedWarnings.add(\1)',
                  c_pipe
              )
              with open(p_pipe, "w") as f:
                  f.write(c_pipe)

          # 4. AboutPrivacyScreen.kt: Join broken multi-line strings and escape inner quotes
          p_about = "app/src/main/java/com/cn/upscaler/feature/about/AboutPrivacyScreen.kt"
          if os.path.exists(p_about):
              with open(p_about, "r") as f:
                  raw = f.read()
              out_lines = []
              in_broken_str = False
              buffer = ""
              for line in raw.splitlines():
                  cleaned = re.sub(r'\$\{[^}]*\}', '', line)
                  q_count = len(re.findall(r'(?<!\\)"', cleaned))
                  if not in_broken_str:
                      if q_count % 2 == 1 and '"""' not in line:
                          in_broken_str = True
                          buffer = line.rstrip() + " "
                      else:
                          out_lines.append(line)
                  else:
                      buffer += line.strip()
                      cleaned_buf = re.sub(r'\$\{[^}]*\}', '', buffer)
                      if len(re.findall(r'(?<!\\)"', cleaned_buf)) % 2 == 0:
                          in_broken_str = False
                          out_lines.append(buffer)
                          buffer = ""
                      else:
                          buffer += " "
              if buffer:
                  out_lines.append(buffer)

              for idx, line in enumerate(out_lines):
                  if '${' not in line and line.count('"') > 2:
                      first = line.find('"')
                      last = line.rfind('"')
                      if first != -1 and last > first:
                          between = line[first+1:last]
                          if not re.search(r'"\s*,\s*"', between):
                              inner = between.replace('\\"', '"').replace('"', '\\"')
                              out_lines[idx] = line[:first+1] + inner + line[last:]
              with open(p_about, "w") as f:
                  f.write("\n".join(out_lines) + "\n")

          # 5. ModelSpecification.kt, HomeScreen.kt, ImageSelectionScreen.kt: Escape unescaped inner quotes on single lines
          for fp in [
              "app/src/main/java/com/cn/upscaler/core/ai/ModelSpecification.kt",
              "app/src/main/java/com/cn/upscaler/feature/home/HomeScreen.kt",
              "app/src/main/java/com/cn/upscaler/feature/selection/ImageSelectionScreen.kt"
          ]:
              if os.path.exists(fp):
                  with open(fp, "r") as f:
                      lines = f.read().splitlines()
                  for idx, line in enumerate(lines):
                      if '${' in line or ' else ' in line or 'if (' in line:
                          continue
                      if line.count('"') > 2:
                          first = line.find('"')
                          last = line.rfind('"')
                          if first != -1 and last > first:
                              between = line[first+1:last]
                              if not re.search(r'"\s*,\s*"', between):
                                  inner = between.replace('\\"', '"').replace('"', '\\"')
                                  lines[idx] = line[:first+1] + inner + line[last:]
                  with open(fp, "w") as f:
                      f.write("\n".join(lines) + "\n")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CN-Upscaler-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
